# This file is used to create a Greenplum cluster with configuration in separate containers:
# 1 master - pirod_gp_master
# 2 primary segments without mirrors
# With persistent volumes.
# Minio

version: '3'
services:
  pirod_gp_master:
    image: ${IMAGE_NAME}:${TAG}
    container_name: pirod_gp_master
    hostname: pirod_gp_master
    ports:
      - "${EXPOSE_MASTER_PORT}:5432"
    environment:
      - GREENPLUM_DEPLOYMENT=master
      - GREENPLUM_GPPERFMON_ENABLE=true
      - GREENPLUM_DISKQUOTA_ENABLE=true
      - GREENPLUM_PXF_ENABLE=true
      - GREENPLUM_PASSWORD_FILE=/run/secrets/gpdb_password
      - GREENPLUM_GPMON_PASSWORD_FILE=/run/secrets/gpmon_password
    secrets:
      - gpdb_password
      - gpmon_password
    volumes:
      - gpdb-master-data:/data
      - ./conf/gpinitsystem_config:/tmp/gpinitsystem_config
      - ../docs/custom_init_scripts:/docker-entrypoint-initdb.d
      - ./conf/hostfile_gpinitsystem:/tmp/hostfile_gpinitsystem
      - ./conf/ssh/id_rsa:/home/gpadmin/.ssh/id_rsa
      - ./conf/ssh/id_rsa.pub:/home/gpadmin/.ssh/id_rsa.pub
    depends_on:
      - pirod_gp_segment1
      - pirod_gp_segment2
    networks:
      - greenplum

  pirod_gp_segment1:
    image: ${IMAGE_NAME}:${TAG}
    container_name: pirod_gp_segment1
    hostname: pirod_gp_segment1
    command: /start_gpdb.sh "00:primary" "01:primary"
    environment:
      - GREENPLUM_DEPLOYMENT=segment
    volumes:
      - gpdb-segment1-data:/data
      - ./conf/ssh/authorized_keys:/tmp/authorized_keys
    stop_grace_period: 60s
    networks:
      - greenplum

  pirod_gp_segment2:
    image: ${IMAGE_NAME}:${TAG}
    container_name: pirod_gp_segment2
    hostname: pirod_gp_segment2
    command: /start_gpdb.sh "00:primary" "01:primary"
    environment:
      - GREENPLUM_DEPLOYMENT=segment
    volumes:
      - gpdb-segment2-data:/data
      - ./conf/ssh/authorized_keys:/tmp/authorized_keys
    stop_grace_period: 60s
    networks:
      - greenplum
      
  pirod_gp_minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  pirod_gp_minio_init:
    image: minio/mc:latest
    depends_on:
      pirod_gp_minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo "Waiting for MinIO..."
          sleep 1
        done
        mc mb -p local/inspector-dev || true
    restart: "no"

networks:
  greenplum:

volumes:
  gpdb-master-data:
  gpdb-segment1-data:
  gpdb-segment2-data:
  minio_data:

secrets:
  gpdb_password:
    file: ./secrets/gpdb_password
  gpmon_password:
    file: ./secrets/gpmon_password
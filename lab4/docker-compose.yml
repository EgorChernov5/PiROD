# Описывает учебный стенд с тремя хранилищами и Trino.
services:
  postgres:
    image: postgres:16
    container_name: lab4-postgres
    environment:
      POSTGRES_DB: university
      POSTGRES_USER: trino
      POSTGRES_PASSWORD: trino
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - trino-net

  mongodb:
    image: mongo:7
    container_name: lab4-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    networks:
      - trino-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lab4-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
      - ./minio/data:/seed-data:ro
    networks:
      - trino-net

  trino:
    image: trinodb/trino:468
    container_name: lab4-trino
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    depends_on:
      - postgres
      - mongodb
      - minio
    networks:
      - trino-net

# Хранит объекты MinIO между ручными запусками docker compose.
volumes:
  minio-data:

# Объединяет сервисы в одну сеть для обращений по DNS-именам контейнеров.
networks:
  trino-net:
    driver: bridge

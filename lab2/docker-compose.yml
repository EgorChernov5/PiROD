services:
  postgres:
    image: postgres:16-alpine
    container_name: lab2-postgres
    environment:
      POSTGRES_DB: wine_quality
      POSTGRES_USER: wine_user
      POSTGRES_PASSWORD: wine_password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wine_user -d wine_quality"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7
    container_name: lab2-kafka
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: lab2-producer
    environment:
      CSV_PATH: /app/data/winequality-red.csv
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: red-wine-quality
      SEND_INTERVAL_SECONDS: "3"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  spark-app:
    image: bitnami/spark:3.5.1
    container_name: lab2-spark-app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: red-wine-quality
      POSTGRES_URL: jdbc:postgresql://postgres:5432/wine_quality
      POSTGRES_USER: wine_user
      POSTGRES_PASSWORD: wine_password
      SPARK_CHECKPOINT_DIR: /tmp/spark-checkpoints/red-wine-quality
    volumes:
      - ./spark:/opt/spark-apps:ro
      - spark-checkpoints:/tmp/spark-checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command:
      - /opt/bitnami/spark/bin/spark-submit
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      - /opt/spark-apps/spark_app.py
    restart: unless-stopped

volumes:
  postgres-data:
  spark-checkpoints:
